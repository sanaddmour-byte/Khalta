ruleset: 'ENGINEERING'
edition: 'Engineering parameters (not code values)'
source_doc: '02-codes §6'
rules:
  - key: 'eng.grading.target.exponent'
    requirement: 'eng.grading.target.exponent'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 0.45
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Default combined grading target: power-curve exponent'
    note_ar: 'الهدف الافتراضي للتدرج المركب: أس منحنى القدرة'
  - key: 'eng.grading.target.band_pct'
    requirement: 'eng.grading.target.band_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: null
    units: '%'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Default grading band around the 0.45-power curve (Sanad sets)'
    note_ar: 'نطاق التدرج الافتراضي حول منحنى 0.45 (يحدده سند)'
  - key: 'eng.shilstone.cf.min'
    requirement: 'eng.shilstone.cf.min'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 45
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Shilstone coarseness factor: lower bound (starter, confirm)'
    note_ar: 'عامل الخشونة (شيلستون): الحد الأدنى (قيمة مبدئية، يُؤكد)'
  - key: 'eng.shilstone.cf.max'
    requirement: 'eng.shilstone.cf.max'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 75
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Shilstone coarseness factor: upper bound (starter, confirm)'
    note_ar: 'عامل الخشونة (شيلستون): الحد الأعلى (قيمة مبدئية، يُؤكد)'
  - key: 'eng.shilstone.wf.min'
    requirement: 'eng.shilstone.wf.min'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: null
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Shilstone workability factor: lower bound per NMAS (Sanad sets)'
    note_ar: 'عامل قابلية التشغيل (شيلستون): الحد الأدنى لكل مقاس (يحدده سند)'
  - key: 'eng.shilstone.wf.max'
    requirement: 'eng.shilstone.wf.max'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: null
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Shilstone workability factor: upper bound per NMAS (Sanad sets)'
    note_ar: 'عامل قابلية التشغيل (شيلستون): الحد الأعلى لكل مقاس (يحدده سند)'
  - key: 'eng.shilstone.wf.binder_adjust.points'
    requirement: 'eng.shilstone.wf.binder_adjust.points'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 2.5
    units: 'none'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Workability factor added per binder step'
    note_ar: 'نقاط عامل قابلية التشغيل المضافة لكل خطوة محتوى إسمنتي'
  - key: 'eng.shilstone.wf.binder_adjust.per_kg'
    requirement: 'eng.shilstone.wf.binder_adjust.per_kg'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 56
    units: 'kg/m3'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Binder step size for the workability-factor adjustment'
    note_ar: 'حجم خطوة المحتوى الإسمنتي لتعديل عامل قابلية التشغيل'
  - key: 'eng.shilstone.wf.binder_adjust.above_kg'
    requirement: 'eng.shilstone.wf.binder_adjust.above_kg'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 335
    units: 'kg/m3'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Binder content above which the adjustment starts'
    note_ar: 'المحتوى الإسمنتي الذي يبدأ التعديل فوقه'
  - key: 'eng.fines.max_pct_75um'
    requirement: 'eng.fines.max_pct_75um'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: null
    units: '%'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Maximum combined percent passing 75 µm (depends on crushed sand; Sanad sets)'
    note_ar: 'أقصى نسبة مارّة من المنخل 75 ميكرون للمزيج (تعتمد على الرمل المكسر؛ يحددها سند)'
  - key: 'eng.pumpable.min_passing_0_3mm_pct'
    requirement: 'eng.pumpable.min_passing_0_3mm_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: null
    units: '%'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Pumpable mixes: minimum percent passing 0.3 mm (Sanad sets)'
    note_ar: 'الخلطات المضخوخة: أدنى نسبة مارّة من المنخل 0.3 مم (يحددها سند)'
  - key: 'eng.margin.wcm'
    requirement: 'eng.margin.wcm'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 0.02
    units: 'ratio'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Robustness margin subtracted from the w/cm ceiling'
    note_ar: 'هامش المتانة المطروح من الحد الأقصى لنسبة الماء إلى المواد الإسمنتية'
  - key: 'eng.margin.grading_pct_points'
    requirement: 'eng.margin.grading_pct_points'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 2
    units: '%'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Grading kept this many percentage points inside the envelope'
    note_ar: 'يُبقى التدرج داخل المغلف بهذا العدد من النقاط المئوية'
  - key: 'eng.ca_volume.sanity_band_pct'
    requirement: 'eng.ca_volume.sanity_band_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Engineering parameters'
    value: 10
    units: '%'
    clause_ref: '02-codes §6 (starter value; Sanad confirms)'
    verified: false
    note_en: 'Tolerance on the ACI 211.1 coarse-aggregate volume sanity bound'
    note_ar: 'تفاوت حد التحقق من حجم الركام الخشن وفق ACI 211.1'
