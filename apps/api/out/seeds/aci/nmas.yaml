ruleset: 'ACI'
edition: 'ACI 318-19 / ACI 301 / ACI 211.1 / ASTM C94 / ACI 305.1'
source_doc: 'ACI 318-19 Building Code Requirements for Structural Concrete'
rules:
  - key: 'nmas.max_fraction.narrowest_form_dimension'
    requirement: 'nmas.max_fraction.narrowest_form_dimension'
    kind: 'limit_max'
    requirement_class: 'CODE_HARD'
    group: 'Aggregate size'
    value: '1/5'
    units: 'fraction'
    clause_ref: 'ACI 318-19 §26.4.2.1(a)(4)'
    verified: false
    note_en: 'Nominal maximum aggregate size must not exceed this fraction of the narrowest form dimension'
    note_ar: 'يجب ألا يتجاوز المقاس الاعتباري الأكبر للركام هذا الكسر من أضيق بُعد للقالب'
  - key: 'nmas.max_fraction.slab_depth'
    requirement: 'nmas.max_fraction.slab_depth'
    kind: 'limit_max'
    requirement_class: 'CODE_HARD'
    group: 'Aggregate size'
    value: '1/3'
    units: 'fraction'
    clause_ref: 'ACI 318-19 §26.4.2.1(a)(4)'
    verified: false
    note_en: 'Nominal maximum aggregate size must not exceed this fraction of the slab depth'
    note_ar: 'يجب ألا يتجاوز المقاس الاعتباري الأكبر للركام هذا الكسر من سماكة البلاطة'
  - key: 'nmas.max_fraction.min_clear_bar_spacing'
    requirement: 'nmas.max_fraction.min_clear_bar_spacing'
    kind: 'limit_max'
    requirement_class: 'CODE_HARD'
    group: 'Aggregate size'
    value: '3/4'
    units: 'fraction'
    clause_ref: 'ACI 318-19 §26.4.2.1(a)(4)'
    verified: false
    note_en: 'Nominal maximum aggregate size must not exceed this fraction of the minimum clear spacing between bars'
    note_ar: 'يجب ألا يتجاوز المقاس الاعتباري الأكبر للركام هذا الكسر من أدنى مسافة صافية بين القضبان'
