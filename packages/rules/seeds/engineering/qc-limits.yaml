ruleset: 'ENGINEERING'
edition: 'QC-configured limits (not code values)'
source_doc: '02-codes §6 and 01-domain §14.4'
rules:
  - key: 'eng.test_age_limit_days.cement'
    requirement: 'eng.test_age_limit_days.cement'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'days'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a cement test before it counts as stale (QC sets)'
    note_ar: 'أقصى عمر لفحص الإسمنت قبل أن يُعدّ قديماً (يحدده ضبط الجودة)'
  - key: 'eng.test_age_limit_days.scm'
    requirement: 'eng.test_age_limit_days.scm'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'days'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a scm test before it counts as stale (QC sets)'
    note_ar: 'أقصى عمر لفحص المواد الإسمنتية التكميلية قبل أن يُعدّ قديماً (يحدده ضبط الجودة)'
  - key: 'eng.test_age_limit_days.fine_agg'
    requirement: 'eng.test_age_limit_days.fine_agg'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'days'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a fine_agg test before it counts as stale (QC sets)'
    note_ar: 'أقصى عمر لفحص الركام الناعم قبل أن يُعدّ قديماً (يحدده ضبط الجودة)'
  - key: 'eng.test_age_limit_days.coarse_agg'
    requirement: 'eng.test_age_limit_days.coarse_agg'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'days'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a coarse_agg test before it counts as stale (QC sets)'
    note_ar: 'أقصى عمر لفحص الركام الخشن قبل أن يُعدّ قديماً (يحدده ضبط الجودة)'
  - key: 'eng.test_age_limit_days.admixture'
    requirement: 'eng.test_age_limit_days.admixture'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'days'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a admixture test before it counts as stale (QC sets)'
    note_ar: 'أقصى عمر لفحص الإضافات قبل أن يُعدّ قديماً (يحدده ضبط الجودة)'
  - key: 'eng.moisture.max_total_pct'
    requirement: 'eng.moisture.max_total_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: '%'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Largest plausible total moisture entered for an aggregate (QC sets)'
    note_ar: 'أكبر رطوبة كلية معقولة تُدخل للركام (يحددها ضبط الجودة)'
  - key: 'eng.moisture.stale_hours'
    requirement: 'eng.moisture.stale_hours'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'none'
    clause_ref: '02-codes §6'
    verified: false
    note_en: 'Maximum age of a moisture reading in hours (QC sets)'
    note_ar: 'أقصى عمر لقراءة الرطوبة بالساعات (يحدده ضبط الجودة)'
  - key: 'eng.trial.air_tolerance_pct'
    requirement: 'eng.trial.air_tolerance_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: '%'
    clause_ref: '01-domain §14.4'
    verified: false
    note_en: 'Trial batch air-content tolerance (QC sets)'
    note_ar: 'تفاوت محتوى الهواء للخلطة التجريبية (يحدده ضبط الجودة)'
  - key: 'eng.trial.density_band_kg_m3'
    requirement: 'eng.trial.density_band_kg_m3'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'kg/m3'
    clause_ref: '01-domain §14.4'
    verified: false
    note_en: 'Trial batch fresh-density band (QC sets)'
    note_ar: 'نطاق الكثافة الطازجة للخلطة التجريبية (يحدده ضبط الجودة)'
  - key: 'eng.trial.yield_band_m3'
    requirement: 'eng.trial.yield_band_m3'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'none'
    clause_ref: '01-domain §14.4'
    verified: false
    note_en: 'Trial batch yield band (QC sets)'
    note_ar: 'نطاق ناتج الخلطة التجريبية (يحدده ضبط الجودة)'
  - key: 'eng.trial.slump_tolerance_mm'
    requirement: 'eng.trial.slump_tolerance_mm'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'mm'
    clause_ref: '01-domain §14.4'
    verified: false
    note_en: 'Trial batch slump tolerance around the target, ± mm (QC sets from ASTM C94 or the project)'
    note_ar: 'تفاوت هبوط الخلطة التجريبية حول القيمة المستهدفة، ± ملم (يحدده ضبط الجودة من ASTM C94 أو المشروع)'
  - key: 'eng.trial.temperature_max_c'
    requirement: 'eng.trial.temperature_max_c'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'degC'
    clause_ref: '01-domain §14.4'
    verified: false
    note_en: 'Maximum concrete temperature of a trial batch, °C (hot-weather limit; QC sets)'
    note_ar: 'أقصى درجة حرارة للخرسانة في الخلطة التجريبية، °م (حد الطقس الحار؛ يحدده ضبط الجودة)'

  - key: 'eng.trial.retention_min_slump_mm'
    requirement: 'eng.trial.retention_min_slump_mm'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'mm'
    clause_ref: 'docs/adr/0023-trial-and-strength-governance.md'
    verified: false
    note_en: 'Optional trial criterion: the slump measured after the retention time must be at least this, mm. Applied only once QC enters it together with the retention time.'
    note_ar: 'معيار اختياري للتجربة: يجب ألا يقل الهبوط المقاس بعد زمن الاحتفاظ عن هذه القيمة، ملم. يُطبَّق بعد أن يدخله ضبط الجودة مع زمن الاحتفاظ.'
  - key: 'eng.trial.retention_minutes'
    requirement: 'eng.trial.retention_minutes'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'none'
    clause_ref: 'docs/adr/0023-trial-and-strength-governance.md'
    verified: false
    note_en: 'Optional trial criterion: minutes after mixing at which the retained slump must be measured. Applied only once QC enters it together with the minimum retained slump.'
    note_ar: 'معيار اختياري للتجربة: عدد الدقائق بعد الخلط التي يُقاس عندها الهبوط المحتفَظ به. يُطبَّق بعد أن يدخله ضبط الجودة مع الحد الأدنى للهبوط.'
  - key: 'eng.trial.stability_required'
    requirement: 'eng.trial.stability_required'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'none'
    clause_ref: 'docs/adr/0023-trial-and-strength-governance.md'
    verified: false
    note_en: 'Optional trial criterion: enter 1 when bleeding and segregation must be observed and the batch found stable. Not applied until QC sets it.'
    note_ar: 'معيار اختياري للتجربة: أدخل 1 عند وجوب ملاحظة النزف والانفصال وثبات الخلطة. لا يُطبَّق حتى يحدده ضبط الجودة.'
  - key: 'eng.trial.placement_required'
    requirement: 'eng.trial.placement_required'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'QC limits'
    value: null
    units: 'none'
    clause_ref: 'docs/adr/0023-trial-and-strength-governance.md'
    verified: false
    note_en: 'Optional trial criterion: enter 1 when pumping and finishing must be observed and found acceptable. A pumpable design cannot pass its trial until QC sets this.'
    note_ar: 'معيار اختياري للتجربة: أدخل 1 عند وجوب ملاحظة الضخ والتشطيب وقبولهما. لا يجتاز تصميم قابل للضخ تجربته حتى يحدد ضبط الجودة هذا المعيار.'
