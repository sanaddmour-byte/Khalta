ruleset: 'ENGINEERING'
edition: 'Engineering parameters (not code values)'
source_doc: 'docs/calc/batch-moisture.md §5'
rules:
  - key: 'eng.batch.max_size_m3'
    requirement: 'eng.batch.max_size_m3'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Batch preparation'
    value: null
    units: 'none'
    clause_ref: 'docs/calc/batch-moisture.md §5'
    verified: false
    note_en: 'Largest batch the mixer takes, m³. Not on file: a batch plan cannot be saved without it (QC sets).'
    note_ar: 'أكبر خلطة يتحملها الخلاط، م³. غير متوفرة: لا يمكن حفظ خطة خلطة بدونها (يحددها ضبط الجودة).'
  - key: 'eng.batch.max_rounding_deviation_pct'
    requirement: 'eng.batch.max_rounding_deviation_pct'
    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Batch preparation'
    value: null
    units: '%'
    clause_ref: 'docs/calc/batch-moisture.md §5'
    verified: false
    note_en: 'Largest permitted deviation, % of the exact mass, when a weighed mass is rounded to the equipment resolution. Not on file: a batch plan cannot be saved without it (QC sets).'
    note_ar: 'أكبر انحراف مسموح، كنسبة من الكتلة الدقيقة، عند تقريب الكتلة الموزونة إلى دقة المعدات. غير متوفر: لا يمكن حفظ خطة خلطة بدونه (يحدده ضبط الجودة).'
