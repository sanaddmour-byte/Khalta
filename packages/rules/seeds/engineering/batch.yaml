    kind: 'parameter'
    requirement_class: 'ENGINEERING_GUARDRAIL'
    group: 'Batch preparation'
    value: null
    units: 'none'
    clause_ref: 'docs/calc/batch-moisture.md §5'
    verified: false
    note_en: 'Weigh-hopper resolution for cement, kg: weighed masses are rounded to a multiple of it. Not on file: a batch plan cannot be saved without it (QC sets).'
    note_ar: 'دقة قادوس الوزن لـالإسمنت، كغم: تُقرَّب الكتل الموزونة إلى مضاعف لها. غير متوفرة: لا يمكن حفظ خطة خلطة بدونها (يحددها ضبط الجودة).'
