ruleset: 'JS'
edition: 'Jordanian Structural Concrete Code 2022 (JSC-2022)'
source_doc: 'Jordanian National Building Code, Structural Concrete Code (2022), Parts 1 and 2'
rules:
  - key: 'fcr.statistical.min_tests'
    requirement: 'fcr.statistical.min_tests'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Minimum number of consecutive tests for the statistical method (Jordanian value to be entered.)'
    note_ar: 'أدنى عدد من الفحوص المتتالية لتطبيق الطريقة الإحصائية (تُدخل القيمة الأردنية.)'
  - key: 'fcr.statistical.fc_window_mpa'
    requirement: 'fcr.statistical.fc_window_mpa'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "Tests must come from mixes with f'c within this many MPa of the specified value (Jordanian value to be entered.)"
    note_ar: 'يجب أن تكون الفحوص من خلطات تقع مقاومتها ضمن هذا الفرق (ميغاباسكال) من القيمة المحددة (تُدخل القيمة الأردنية.)'
  - key: 'fcr.statistical.n_factor'
    requirement: 'fcr.statistical.n_factor'
    kind: 'table'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    definition: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Standard-deviation multiplier by number of tests (1.00 from 30 tests) (Jordanian value to be entered.)'
    note_ar: 'معامل ضرب الانحراف المعياري حسب عدد الفحوص (1.00 عند 30 فحصاً) (تُدخل القيمة الأردنية.)'
  - key: 'fcr.threshold_mpa'
    requirement: 'fcr.threshold_mpa'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "Strength at which the f'cr equations change (Jordanian value to be entered.)"
    note_ar: "المقاومة التي تتغير عندها معادلات f'cr (تُدخل القيمة الأردنية.)"
  - key: 'fcr.statistical.le35.k1'
    requirement: 'fcr.statistical.le35.k1'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "f'cr = max(f'c + k1·s, f'c + k2·s − offset) for f'c ≤ 35 MPa: k1 (Jordanian value to be entered.)"
    note_ar: "المعادلة لـ f'c ≤ 35: المعامل k1 (تُدخل القيمة الأردنية.)"
  - key: 'fcr.statistical.le35.k2'
    requirement: 'fcr.statistical.le35.k2'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Same equation: k2 (Jordanian value to be entered.)'
    note_ar: 'المعامل k2 (تُدخل القيمة الأردنية.)'
  - key: 'fcr.statistical.le35.offset'
    requirement: 'fcr.statistical.le35.offset'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Same equation: offset subtracted (MPa) (Jordanian value to be entered.)'
    note_ar: 'القيمة المطروحة (ميغاباسكال) (تُدخل القيمة الأردنية.)'
  - key: 'fcr.statistical.gt35.k1'
    requirement: 'fcr.statistical.gt35.k1'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "f'cr = max(f'c + k1·s, factor·f'c + k2·s) for f'c > 35 MPa: k1 (Jordanian value to be entered.)"
    note_ar: "المعادلة لـ f'c > 35: المعامل k1 (تُدخل القيمة الأردنية.)"
  - key: 'fcr.statistical.gt35.k2'
    requirement: 'fcr.statistical.gt35.k2'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Same equation: k2 (Jordanian value to be entered.)'
    note_ar: 'المعامل k2 (تُدخل القيمة الأردنية.)'
  - key: 'fcr.statistical.gt35.factor'
    requirement: 'fcr.statistical.gt35.factor'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "Same equation: factor on f'c (Jordanian value to be entered.)"
    note_ar: "المعامل المضروب في f'c (تُدخل القيمة الأردنية.)"
  - key: 'fcr.no_data.lower_threshold_mpa'
    requirement: 'fcr.no_data.lower_threshold_mpa'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: 'Strength below which the no-data addition is the lowest (Jordanian value to be entered.)'
    note_ar: 'المقاومة التي دونها تُطبق أصغر إضافة عند غياب البيانات (تُدخل القيمة الأردنية.)'
  - key: 'fcr.no_data.lt21.add'
    requirement: 'fcr.no_data.lt21.add'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "No-data required average strength: f'c + this, for f'c < 21 MPa (Jordanian value to be entered.)"
    note_ar: "المقاومة المتوسطة المطلوبة عند غياب البيانات: f'c + هذه القيمة عندما f'c < 21 (تُدخل القيمة الأردنية.)"
  - key: 'fcr.no_data.mid.add'
    requirement: 'fcr.no_data.mid.add'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "No-data: f'c + this, for 21 ≤ f'c ≤ 35 MPa (Jordanian value to be entered.)"
    note_ar: "عند غياب البيانات: f'c + هذه القيمة عندما 21 ≤ f'c ≤ 35 (تُدخل القيمة الأردنية.)"
  - key: 'fcr.no_data.gt35.factor'
    requirement: 'fcr.no_data.gt35.factor'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'none'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "No-data: factor on f'c for f'c > 35 MPa (Jordanian value to be entered.)"
    note_ar: "عند غياب البيانات: المعامل المضروب في f'c عندما f'c > 35 (تُدخل القيمة الأردنية.)"
  - key: 'fcr.no_data.gt35.add'
    requirement: 'fcr.no_data.gt35.add'
    kind: 'parameter'
    requirement_class: 'CODE_HARD'
    group: 'Required average strength'
    value: null
    units: 'MPa'
    clause_ref: 'JSC-2022 §TBD'
    verified: false
    note_en: "No-data: addition (MPa) for f'c > 35 MPa (Jordanian value to be entered.)"
    note_ar: "عند غياب البيانات: الإضافة (ميغاباسكال) عندما f'c > 35 (تُدخل القيمة الأردنية.)"
