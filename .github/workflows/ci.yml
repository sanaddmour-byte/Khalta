name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khalta
          POSTGRES_PASSWORD: khalta
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U khalta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # role must be allowed to CREATE DATABASE: tests clone a migrated template per test file
      TEST_DATABASE_URL: postgres://khalta:khalta@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rules
      - run: pnpm db:drift
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
